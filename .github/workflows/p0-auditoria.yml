name: Auditoria P0/P1 Fusion

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria-p0-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar estrutura
        run: npm run check

      - name: Executar regressoes P0
        run: npm run test:p0-auditoria

      - name: Executar implantacao repetivel P1
        run: npm run test:p1-implantacao

      - name: Executar observabilidade P1
        run: npm run test:observabilidade

      - name: Executar Billing SaaS P1
        run: npm run test:saas-billing
