<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curadoria 664 | Fusion</title>
<script src="/assets/js/fusion-portal-guard.js" data-fusion-guard="professor"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#172033}.wrap{max-width:1180px;margin:auto;padding:18px}.top,.painel,.card{background:#fff;border:1px solid #dbe2ea;border-radius:14px}.top{padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{margin:0 0 5px;font-size:24px}.top p{margin:0;color:#64748b}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:10px 14px;cursor:pointer;text-decoration:none;color:#172033;font-weight:700}.btn.ok{background:#0f766e;color:#fff;border-color:#0f766e}.btn.no{background:#b91c1c;color:#fff;border-color:#b91c1c}.btn.rev{background:#b45309;color:#fff;border-color:#b45309}.painel{margin-top:14px;padding:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.k{background:#f8fafc;border-radius:10px;padding:10px}.k b{display:block;font-size:22px}.k span{font-size:12px;color:#64748b}.filtros{margin:14px 0;display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px}.filtros select,.filtros input,.campo input,.campo select,.campo textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.card{padding:18px;display:grid;grid-template-columns:minmax(280px,440px) 1fr;gap:22px}.midia{background:#eef2f7;border-radius:12px;min-height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden}.midia img{max-width:100%;max-height:520px;object-fit:contain}.dados{display:grid;gap:12px}.campo label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:5px}.original{padding:10px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;word-break:break-word}.acoes{display:flex;gap:8px;flex-wrap:wrap}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.status{font-size:13px;color:#64748b}.salvando{color:#b45309}.salvo{color:#047857}.erro{color:#b91c1c}.vazio{padding:40px;text-align:center}.contador{font-weight:700}.atalhos{font-size:12px;color:#64748b}.grupo-sugerido{font-size:12px;color:#64748b;margin-top:4px}@media(max-width:800px){.painel{grid-template-columns:repeat(2,1fr)}.filtros{grid-template-columns:1fr}.card{grid-template-columns:1fr}.midia{min-height:300px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><h1>Curadoria da galeria 664</h1><p>Revise GIF por GIF. Nome, grupo e decisão ficam salvos no Fusion/Supabase.</p></div><a class="btn" href="/pages/treinos/index.html">← Montador</a></header>
<section class="painel">
<div class="k"><b id="tot">0</b><span>Total</span></div><div class="k"><b id="ana">0</b><span>Analisados</span></div><div class="k"><b id="apr">0</b><span>Aprovados</span></div><div class="k"><b id="des">0</b><span>Descartados</span></div><div class="k"><b id="rev">0</b><span>Revisar depois</span></div>
</section>
<div class="filtros"><select id="fStatus"><option value="pendente">Pendentes</option><option value="todos">Todos</option><option value="aprovado">Aprovados</option><option value="descartado">Descartados</option><option value="revisar">Revisar depois</option></select><select id="fGrupo"><option value="">Todos os grupos</option></select><input id="busca" placeholder="Buscar nome original ou português"></div>
<div id="area"><div class="vazio">Carregando os 664 exercícios. Na primeira abertura pode levar alguns segundos...</div></div>
<div class="nav"><button class="btn" id="ant">← Anterior</button><div><span class="contador" id="pos">0/0</span> · <span class="status" id="st">Carregando...</span></div><button class="btn" id="prox">Próximo →</button></div>
</main>
<script>
const GRUPOS=["PEITO","COSTAS","OMBROS","BÍCEPS","TRÍCEPS","ANTEBRAÇOS","QUADRÍCEPS","POSTERIOR","GLÚTEOS","PANTURRILHAS","CORE","CARDIO","PESCOÇO","MOBILIDADE","OUTROS"];
let exercicios=[],curadoria={itens:{}},lista=[],indice=0;
const $=id=>document.getElementById(id);
function norm(v){return String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function sessao(){for(const k of["fusion_professor_sessao","fusion_professor_portal"]){try{const s=JSON.parse(localStorage.getItem(k)||"null");if(s)return s}catch{}}return null}
function headers(h={}){const s=sessao()||{};const t=s.token||s.accessToken||s.jwt||"";return t?{...h,Authorization:`Bearer ${t}`}:{...h}}
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",...opt,headers:headers(opt.headers||{})});const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.mensagem||`HTTP ${r.status}`);return j}
function gid(x){return String(x.id||x.bibliotecaId||x.exercicioId||x.codigo||"")}
function sugerirGrupo(x){const t=norm([x.grupo,x.grupoMuscular,x.musculos,x.nomeOriginal,x.nome].join(" "));if(/cardio|esteira|bicic|bike|ergometr/.test(t))return"CARDIO";if(/peito|chest|pector/.test(t))return"PEITO";if(/costas|back|latiss|dorsal/.test(t))return"COSTAS";if(/ombro|shoulder|delt/.test(t))return"OMBROS";if(/triceps/.test(t))return"TRÍCEPS";if(/biceps/.test(t))return"BÍCEPS";if(/antebr|forearm/.test(t))return"ANTEBRAÇOS";if(/panturr|calf|gastrocn|soleus/.test(t))return"PANTURRILHAS";if(/glute/.test(t))return"GLÚTEOS";if(/posterior|hamstring|biceps femoral/.test(t))return"POSTERIOR";if(/quad|upper leg|pernas/.test(t))return"QUADRÍCEPS";if(/core|abs|abdom|waist/.test(t))return"CORE";if(/neck|pescoco/.test(t))return"PESCOÇO";return"OUTROS"}
function itemSalvo(x){return curadoria.itens?.[gid(x)]||null}
function preencherGrupos(){GRUPOS.forEach(g=>{const o=document.createElement("option");o.value=g;o.textContent=g;$("fGrupo").appendChild(o)})}
function atualizarContadores(){const vals=Object.values(curadoria.itens||{});$("tot").textContent=exercicios.length;$("ana").textContent=vals.length;$("apr").textContent=vals.filter(x=>x.status==="aprovado").length;$("des").textContent=vals.filter(x=>x.status==="descartado").length;$("rev").textContent=vals.filter(x=>x.status==="revisar").length}
function aplicarFiltros(){const fs=$("fStatus").value,fg=$("fGrupo").value,q=norm($("busca").value);lista=exercicios.filter(x=>{const c=itemSalvo(x),st=c?.status||"pendente",g=c?.grupo||sugerirGrupo(x);if(fs!=="todos"&&st!==fs)return false;if(fg&&g!==fg)return false;if(q&&!norm([x.nomeOriginal,x.nome,c?.nomePtBr].join(" ")).includes(q))return false;return true});indice=Math.min(indice,Math.max(0,lista.length-1));render()}
function render(){const x=lista[indice];$("pos").textContent=lista.length?`${indice+1}/${lista.length}`:"0/0";if(!x){$("area").innerHTML='<div class="vazio">Nenhum exercício neste filtro.</div>';return}const c=itemSalvo(x)||{};const grupo=c.grupo||sugerirGrupo(x);const nome=c.nomePtBr||x.nome||"";const equipamento=x.equipamento||c.equipamento||"Não informado";$("area").innerHTML=`<section class="card"><div class="midia"><img src="${x.gif||x.midia||x.imagemUrl||""}" alt=""></div><div class="dados"><div class="campo"><label>Código</label><div class="original">${gid(x)}</div></div><div class="campo"><label>Nome original</label><div class="original">${esc(x.nomeOriginal||"")}</div></div><div class="campo"><label>Nome oficial em português</label><input id="nomePt" value="${attr(nome)}"></div><div class="campo"><label>Grupo muscular</label><select id="grupo">${GRUPOS.map(g=>`<option ${g===grupo?"selected":""}>${g}</option>`).join("")}</select><div class="grupo-sugerido">Sugestão automática: ${sugerirGrupo(x)}</div></div><div class="campo"><label>Equipamento informado pela galeria</label><div class="original">${esc(equipamento)}</div></div><div class="campo"><label>Importância para a biblioteca Fusion</label><select id="prio"><option value="essencial" ${c.prioridade==="essencial"||!c.prioridade?"selected":""}>Essencial</option><option value="variacao" ${c.prioridade==="variacao"?"selected":""}>Variação útil</option><option value="opcional" ${c.prioridade==="opcional"?"selected":""}>Opcional</option></select></div><div class="campo"><label>Observação</label><textarea id="obs" rows="3">${esc(c.observacao||"")}</textarea></div><div class="acoes"><button class="btn ok" onclick="salvar('aprovado')">APROVAR</button><button class="btn no" onclick="salvar('descartado')">DESCARTAR</button><button class="btn rev" onclick="salvar('revisar')">REVISAR DEPOIS</button></div><div class="atalhos">Status atual: <b>${c.status||"PENDENTE"}</b>. As decisões ficam salvas no banco, não no navegador.</div></div></section>`}
function esc(v){return String(v||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function attr(v){return esc(v).replace(/'/g,"&#39;")}
async function salvar(status){const x=lista[indice];if(!x)return;const nomePt=$("nomePt").value.trim(),grupo=$("grupo").value;if(!nomePt||!grupo)return alert("Informe nome em português e grupo.");$("st").textContent="Salvando...";$("st").className="status salvando";try{const id=gid(x);const r=await api(`/api/treinos/curadoria-exercisedb/${encodeURIComponent(id)}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({nomeOriginal:x.nomeOriginal||"",nomePtBr:nomePt,grupo,equipamento:x.equipamento||"",prioridade:$("prio").value,status,observacao:$("obs").value})});curadoria.itens[id]=r.dados;atualizarContadores();$("st").textContent="Salvo no Supabase";$("st").className="status salvo";const atualId=id;aplicarFiltros();if(lista.length&&gid(lista[indice])===atualId&&indice<lista.length-1){indice++;render()}}catch(e){$("st").textContent=e.message;$("st").className="status erro"}}
$("ant").onclick=()=>{if(lista.length){indice=(indice-1+lista.length)%lista.length;render()}};
$("prox").onclick=()=>{if(lista.length){indice=(indice+1)%lista.length;render()}};
$("fStatus").onchange=()=>{indice=0;aplicarFiltros()};$("fGrupo").onchange=()=>{indice=0;aplicarFiltros()};$("busca").oninput=()=>{indice=0;aplicarFiltros()};
async function iniciar(){preencherGrupos();try{const [b,c]=await Promise.all([api("/api/treinos/biblioteca?catalogo=teste-664"),api("/api/treinos/curadoria-exercisedb")]);exercicios=Array.isArray(b.dados?.exercicios)?b.dados.exercicios:[];curadoria=c.dados&&typeof c.dados==="object"?c.dados:{itens:{}};curadoria.itens=curadoria.itens||{};atualizarContadores();$("st").textContent="Pronto";aplicarFiltros()}catch(e){$("area").innerHTML=`<div class="vazio erro">${esc(e.message)}</div>`;$("st").textContent="Falha ao carregar";$("st").className="status erro"}}
iniciar();
</script></body></html>
