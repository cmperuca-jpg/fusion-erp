<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Aplicativos da academia</title>
</head>
<body>
  <p>Redirecionando para a página da academia…</p>
  <script>
    (() => {
      const ctx = window.__FUSION_TENANT_CONTEXT__ || {};
      const slug = String(
        ctx.slug ||
        location.pathname.split("/").filter(Boolean)[0] ||
        ""
      ).trim();

      if (slug) {
        location.replace("/" + encodeURIComponent(slug) + "#aplicativos");
      } else {
        location.replace("/");
      }
    })();
  </script>
</body>
</html>
